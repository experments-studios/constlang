<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ConstLang Compiler</title>
    <script src="constlangpocketer.js"></script>
    <script src="cpm.js"></script>
    <style>
        :root {
            --bg-color: #0e0e0e;
            --text-color: #d4d4d4;
            --prompt-color: #4ec9b0;
            --input-color: #ffffff;
            --border-color: #2d2d30;
            --accent-border: #007acc;
            --cursor-color: #aeafad;
            --secondary-text: #858585;
            --error-color: #f48771;
            --success-color: #6a9955;
            --info-color: #569cd6;
            --warning-color: #dcdcaa;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px; font-weight: 500; overflow: hidden;
        }

        #display {
            width: 100%; height: 100vh; padding: 16px 20px;
            overflow-y: auto; display: flex; flex-direction: column;
            line-height: 1.6; letter-spacing: 0.3px;
        }

        .line { white-space: pre-wrap; word-wrap: break-word; margin-bottom: 1px; }
        .system-info { margin-bottom: 8px; color: var(--secondary-text); font-size: 12px; }

        .input-line { display: flex; align-items: center; width: 100%; margin-top: 2px; }
        .prompt { color: var(--prompt-color); font-weight: 600; margin-right: 8px; }

        .input-container { position: relative; flex: 1; display: inline-flex; align-items: center; }
        #cmd-input {
            width: 100%; background: transparent; border: none;
            color: var(--input-color); font-family: inherit; font-size: inherit;
            outline: none; z-index: 5; padding: 0;
        }

        .lib-call { color: var(--info-color); }
        .success { color: var(--success-color); }
        .error { color: var(--error-color); }

        #display::-webkit-scrollbar { width: 12px; }
        #display::-webkit-scrollbar-track { background: var(--bg-color); }
        #display::-webkit-scrollbar-thumb {
            background: var(--border-color); border-radius: 6px; border: 2px solid var(--bg-color);
        }
    </style>
</head>
<body>

<div id="display">
    <div class="system-info"> Constlang 11</div>
    <div class="system-info">© 2026 Ilkin Yahya. All rights reserved.</div>
    <div id="history"></div>
    <div class="input-line">
        <span class="prompt">Constlang >></span>
        <div class="input-container">
            <input type="text" id="cmd-input" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>
</div>

<script>
    const { ipcRenderer } = require('electron');
    const history = document.getElementById('history');
    const input = document.getElementById('cmd-input');
    const display = document.getElementById('display');

    // CLI Komut Dinleyicisi
    ipcRenderer.on('run-cli-command', async (event, command) => {
        printLine(`<span class="prompt">CLI >></span> ${command}`);
        await executeCommand(command);
    });

    // .csdf Script Dinleyicisi
    ipcRenderer.on('run-csdf-script', async (event, content) => {
        const lines = content.split(/\r?\n/);
        for (let line of lines) {
            let trimmed = line.trim();
            if (!trimmed || trimmed.startsWith("//") || trimmed.startsWith("#")) continue;
            printLine(`<span class="prompt">Script >></span> ${trimmed}`);
            await executeCommand(trimmed);
        }
    });

    input.addEventListener('keydown', async (e) => {
        if (e.key === 'Enter') {
            const raw = input.value;
            printLine(`<span class="prompt">Constlang >></span> ${raw}`);
            input.value = "";
            await executeCommand(raw);
        }
    });

    async function executeCommand(raw) {
        const cmd = raw.trim().toLowerCase();
        if (cmd === "") return;

        // --- Senin Orijinal Komut Mantığın (Hepsini Korudum) ---
        
        if (cmd.startsWith("linux")) {
            const subCmd = raw.substring(5).trim();
            printLine(`<span class='lib-call'>Pocket-Forward: Linux ${subCmd}</span>`);
            if(typeof system !== 'undefined') system.run.sh(subCmd);
        }
        else if (cmd.startsWith("windows")) {
            const subCmd = raw.substring(7).trim();
            printLine(`<span class='lib-call'>Pocket-Forward: Windows ${subCmd}</span>`);
            if(typeof system !== 'undefined') system.run.bat(subCmd);
        }
        else if (cmd.startsWith("macos")) {
            const subCmd = raw.substring(5).trim();
            printLine(`<span class='lib-call'>Pocket-Forward: Macos ${subCmd}</span>`);
            if(typeof system !== 'undefined') system.run.command(subCmd);
        }
        // CPM Install Varyasyonları
        else if (cmd.startsWith("cpm install -url:")) {
            const url = raw.split("-url: ")[1].trim();
            if(typeof cpm !== 'undefined') cpm.install(url);
        }
        else if (cmd.startsWith("cpm install -std:")) {
            const tool = raw.split("-std: ")[1].trim();
            if(typeof cpm !== 'undefined') cpm.install("https://raw.githubusercontent.com/experments-studios/constlang/refs/heads/main/tools/" + tool);
        }
        else if (cmd.startsWith("cpm install -github:")) {
            const repo = raw.split("-github: ")[1].trim();
            if(typeof cpm !== 'undefined') cpm.install("https://raw.githubusercontent.com/" + repo);
        }
        else if (cmd.startsWith("cpm install -constlib:")) {
            const lib = raw.split("-constlib: ")[1].trim();
            if(typeof cpm !== 'undefined') cpm.install("https://raw.githubusercontent.com/experments-studios/constlib/refs/heads/main/libs/" + lib);
        }
         else if (cmd.startsWith("cpm project -fs")) {
            const projectfs = raw.split("-fs ")[1].trim();
            if(typeof cpm !== 'undefined') compiler.add(projectfs);
        }
        else if (cmd.startsWith("cpm publish -fs")) {
            const projectpublish = raw.split("-fs ")[1].trim();
            if(typeof cpm !== 'undefined') compiler.download(projectpublish);
        }
        // Build & Publish
        else if (cmd.includes("constlang build")) {
            printLine("Compiling source files...");
            if (cmd.includes("--app") && typeof compiler !== 'undefined') {
                compiler.start();
            }
            printLine("<span class='success'>Build completed.</span>");
        }
        else if (cmd.includes("constlang publish")) {
            printLine("Downloading source files...");
            if(typeof compiler !== 'undefined') compiler.download();
        }
        // CPM New
        else if (cmd.startsWith("cpm module --")) {
            const type = cmd.replace("cpm module --", "");
            const s = document.body.appendChild(document.createElement('script'));
            s.src = `compilers/${type}compiler.js`;
            s.onload = () => { 
                if(["bat","linux_sh","go","web","app" , "win32" ,"win64","linux32","linux64","mac64" , "mac64_sh" , "mobile" , "docker" , "test"].includes(type) && typeof compiler !== 'undefined') compiler.add(); 
            };
        }
        else if (cmd === "cls" || cmd === "clear") {
            history.innerHTML = "";
        }
        else if (cmd === "constlang version") {
            printLine("version: v11.0");
        }
        else {
            // Hiçbiri değilse varsayılan bat çalıştır
            if(typeof system !== 'undefined') system.run.bat(raw);
        }

        display.scrollTop = display.scrollHeight;
    }

    function printLine(text) {
        const div = document.createElement('div');
        div.className = 'line';
        div.innerHTML = text;
        history.appendChild(div);
    }
    document.addEventListener('click', () => input.focus());
</script>
</body>
</html>
